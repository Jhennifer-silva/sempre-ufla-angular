<div class="home-container">
    <app-hero backgroundImage="/images/backgrounds/fotodecapelos.png">
        <img src="/images/logos/LogoUflaMonocromatica.png"
            [alt]="'home.logo_alt' | translate" class="logo-ufla">

        <div class="hero-title">
            <p class="title"><span>{{ 'home.bem_vindo' | translate }}</span> {{ 'home.texto_boas_vindas' | translate }}</p>
            <p class="subtitle">{{ 'home.texto_historia' | translate }}</p>
        </div>

        <app-btn [texto]="'home.entrar_botao' | translate" rota="/guia-acesso" variant="secondary-green">
        </app-btn>
    </app-hero>

    <app-benefits />

    <app-ajuda-universidade />

    <app-secao-entrar />
</div>
