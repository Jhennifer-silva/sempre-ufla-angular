<div class="carousel-wrapper">
  
  <swiper-container 
    [grabCursor]="true"
    slides-per-view="1" 
    space-between="10"
  >

    @for (card of cards; track $index) {
      <swiper-slide>
        
        <div class="benefit-card">
          
          <div class="card-header">
            <mat-icon class="card-icon">{{ card.icon }}</mat-icon>
          </div>

          <div class="card-footer">
            <span class="card-text">{{ card.title }}</span>
          </div>

        </div>

      </swiper-slide>
    }

  </swiper-container>
</div>
